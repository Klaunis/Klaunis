<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Save The Date Series Playback</title>
    <style>
        :root { color-scheme: dark; }
        body {
            margin: 0;
            padding: 1.5rem;
            background: #000;
            color: #f5f5f5;
            font-family: Inter, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            align-items: center;
            justify-content: flex-start;
        }
        h1 {
            font-size: 1.2rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            margin: 0;
            text-align: center;
        }
        .video-grid {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            max-width: 1200px;
        }
        video {
            width: 100%;
            height: auto;
            border-radius: 18px;
            background: #000;
            outline: none;
        }
        video::-webkit-media-controls-panel {
            background-color: rgba(0, 0, 0, 0.6);
        }
        @media (min-width: 900px) {
            body {
                padding: 2rem 2.5rem;
            }
            .video-grid {
                display: grid;
                grid-template-columns: repeat(3, 1fr);
                gap: 1.25rem;
            }
        }
    </style>
</head>
<body>
    <h1>Save The Date Series</h1>
    <div class="video-grid">
        <video controls preload="metadata" poster="Thumbnail.png">
            <source src="STD.mp4" type="video/mp4">
            <source src="Std.webm" type="video/webm">
            Your browser does not support the video tag.
        </video>
        <video controls preload="metadata" poster="Thumbnail.png">
            <source src="STD 2.mp4" type="video/mp4">
            <source src="Std 2.webm" type="video/webm">
            Your browser does not support the video tag.
        </video>
        <video controls preload="metadata" poster="Thumbnail.png">
            <source src="STD 3.mp4" type="video/mp4">
            <source src="Std 3.webm" type="video/webm">
            Your browser does not support the video tag.
        </video>
    </div>
</body>
</html>
