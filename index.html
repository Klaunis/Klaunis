<!DOCTYPE html>

    <header class="site-header" id="top">
        <div class="site-header__inner">
            <a class="site-logo" href="#top">Kunal Sethi | 3D Generalist & Motion Designer</a>
            <button class="nav-toggle" aria-expanded="false" aria-controls="site-nav" aria-label="Toggle navigation">
                <span></span>

                <a href="#work" class="nav-link">Work</a>
                <a href="#contact" class="nav-link">Contact</a>
            </nav>
        </div>
    </header>

    <main>
        <section id="work" class="work">
            <div class="work-intro">
                <p class="eyebrow">Selected Work</p>
                <h1 class="headline">Cinematic imagery and motion built for mood, story, and impact.</h1>
            </div>
            <div class="work-grid">
                <a class="work-card" href="project-chess.html">
                    <figure>
                        <picture>
                            <source srcset="Portfolio/3D/Chess/Render Chess 1.webp" type="image/webp">
                            <img src="Portfolio/3D/Chess/Render Chess 1.jpg" alt="Cinematic chess board render with dramatic lighting.">
                        </picture>
                        <figcaption>
                            <h2>Game of Chess</h2>
                            <p>A cinematic study in hard-surface modeling and atmospheric lighting. Tools: Blender, Maya.</p>
                        </figcaption>
                    </figure>
                </a>
                <a class="work-card" href="project-social-login.html">
                    <figure>
                        <picture>
                            <source srcset="Portfolio/Motion/Computer Screen Shot.webp" type="image/webp">
                            <img src="Portfolio/Motion/Computer.png" alt="Stylized login interface floating on a dark desktop scene.">
                        </picture>
                        <figcaption>
                            <h2>Social Login Interface</h2>
                            <p>Motion design exploration inspired by tactile UI cinematics. Tools: Illustrator, After Effects.</p>
                        </figcaption>
                    </figure>
                </a>
                <a class="work-card" href="project-marriage.html">
                    <figure>
                        <picture>
                            <img src="Portfolio/Motion/Marriage/Thumbnail.png" alt="Golden invitation cards floating in a cinematic light.">
                        </picture>
                        <figcaption>
                            <h2>Invitation for the Big Day</h2>
                            <p>Elegant wedding invitations designed as looping motion vignettes. Tools: Illustrator, After Effects.</p>
                        </figcaption>
                    </figure>

                <h2>Open to collaborations that demand cinematic storytelling.</h2>
                <div class="contact__links">
                    <a href="mailto:kunaalsethii@gmail.com">kunaalsethii@gmail.com</a>
                    <a href="tel:+919717895116">+91 97178 95116</a>

            </div>

    <footer class="site-footer">
